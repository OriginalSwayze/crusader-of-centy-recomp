# Pushing a tag like v1.2 makes a release with two downloads, neither with any game code in
# it (the game is built from each player's own ROM on their PC):
#   - the installer: Setup.exe with this repository and its third-party submodules appended
#     as a zip (setup/setup.c reads it back), which builds and installs the game;
#   - the builder zip: the same files to unzip, for "Build Crusader of Centy.bat" (GitHub's own
#     "Source code" zips leave the submodules out).
# The release's description is docs/release-<tag>.md (what changed), if there is one,
# followed by NOTES (how to install).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NOTES: |
    **Download `Crusader-of-Centy-Setup-${{ github.ref_name }}.exe`** below and run it.

    1. Setup asks where to install (your user's Programs folder by default; no administrator rights needed).
    2. Pick your own ROM: Crusader of Centy (USA), or Ragnacenty from Japan or Korea (.md, .bin or .gen, or a .zip with one inside). Pick several to switch between their languages in the game. Each is checked as you pick it.
    3. Setup downloads the build tools it needs (Node.js, CMake, Ninja and LLVM-MinGW, about 260 MB, from their publishers, checked against pinned SHA-256s) into the install folder, builds the game from your ROMs (a few minutes), and adds Crusader of Centy to the Start menu.

    To update later, run the new Setup: it keeps your settings, saves and save states. To remove the game, use Settings > Apps > Crusader of Centy Recomp > Uninstall.

    Prefer no installer? Download `Crusader-of-Centy-Recomp-${{ github.ref_name }}.zip` instead, unzip it anywhere and double-click **Build Crusader of Centy.bat**.

    No part of the game is included in this release. You need your own copy of the cartridge.

jobs:
  setup:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: LLVM-MinGW (the same pinned build the installer uses)
        run: |
          curl -L --fail -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip
          echo "b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35  llvm-mingw.zip" | sha256sum -c
          7z x -y -o"$RUNNER_TEMP" llvm-mingw.zip > /dev/null
          echo "$RUNNER_TEMP/llvm-mingw-20260616-ucrt-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build Setup.exe
        run: |
          cmake -S . -B build/cmake -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/cmake --target Setup

      - name: Append the source
        run: |
          name="Crusader-of-Centy-Setup-${GITHUB_REF_NAME}.exe"
          # Staged at the drive's root: the submodules' deepest paths, under the runner's own
          # work folder, pass Windows' 260-character limit. Setup drops the zip's top folder.
          stage=/c/bostage
          mkdir -p "$stage/src"
          # Regular files only: the submodules' symlinks (in examples the build never uses)
          # are links on this runner, some to nothing, and do not unpack on Windows anyway.
          git ls-files -z --recurse-submodules | while IFS= read -r -d '' f; do
            if [ -L "$f" ] || [ ! -f "$f" ]; then continue; fi
            mkdir -p "$stage/src/$(dirname "$f")"
            cp "$f" "$stage/src/$f" || { echo "could not copy $f"; exit 1; }
          done
          (cd "$stage" && 7z a -tzip -mx=9 source.zip src > /dev/null)
          cp "$stage/source.zip" source.zip
          cp build/cmake/Setup.exe "$name"
          cat source.zip >> "$name"
          python -c "import struct,os; f=open('$name','ab'); f.write(struct.pack('<Q', os.path.getsize('source.zip'))); f.write(b'BOAPAYLD')"
          echo "SETUP=$name" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          { if [ -f "docs/release-${GITHUB_REF_NAME}.md" ]; then cat "docs/release-${GITHUB_REF_NAME}.md"; echo; echo "---"; echo; fi
            echo "$NOTES"; } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.SETUP }}
          body_path: release-notes.md

  builder-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make the builder zip
        run: |
          name="Crusader-of-Centy-Recomp-${GITHUB_REF_NAME}"
          mkdir -p "stage/Crusader of Centy Recomp"
          git ls-files -z --recurse-submodules | xargs -0 cp -P --parents -t "stage/Crusader of Centy Recomp"
          # Symlinks (in the submodules' examples, which the build never uses) do not unzip on Windows.
          find stage -type l -delete
          (cd stage && zip -qr9 "../${name}.zip" "Crusader of Centy Recomp")
          echo "ZIP=${name}.zip" >> "$GITHUB_ENV"

      - name: Release notes
        run: |
          { if [ -f "docs/release-${GITHUB_REF_NAME}.md" ]; then cat "docs/release-${GITHUB_REF_NAME}.md"; echo; echo "---"; echo; fi
            echo "$NOTES"; } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body_path: release-notes.md
